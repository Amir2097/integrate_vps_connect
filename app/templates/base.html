<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VPN Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .navbar { background: var(--bg-card) !important; border-bottom: 1px solid var(--border); }
        .navbar-brand, .navbar .btn { color: var(--text) !important; }
        .navbar .btn-outline-light { border-color: var(--border); color: var(--text-muted); }
        .navbar .btn-outline-light:hover { border-color: var(--accent); color: var(--accent); }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; }
        .table { color: var(--text); }
        .table th { color: var(--text-muted); font-weight: 500; border-color: var(--border); }
        .table td { border-color: var(--border); }
        .table-striped tbody tr:nth-of-type(odd) { background: rgba(255,255,255,0.02); }
        .badge { font-weight: 500; }
        .form-control, .form-control:focus { background: var(--bg); border-color: var(--border); color: var(--text); }
        .btn-success { background: var(--success); border-color: var(--success); }
        .btn-outline-danger { border-color: var(--danger); color: var(--danger); }
        .btn-outline-warning { border-color: var(--warning); color: var(--warning); }
        h1, h2 { font-weight: 600; color: var(--text); }
        .text-muted { color: var(--text-muted) !important; }
        .section-title { font-size: 0.95rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="bg-dark">
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">VPN Admin</a>
            <a class="btn btn-outline-light btn-sm" href="/admin">Дашборд</a>
            <a class="btn btn-outline-light btn-sm" href="/admin/logout">Выход</a>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
